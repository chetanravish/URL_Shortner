name: Deploy URL Shortener to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # AWS Login
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install & Build Frontend
      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Build React App
        working-directory: ./Frontend
        run: npm run build

      # Build Frontend Docker Image
      - name: Build Frontend Docker Image
        working-directory: ./Frontend
        run: docker build -t url-shortener-frontend .

      - name: Tag Frontend Image
        run: |
          docker tag url-shortener-frontend:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/url-shortener-frontend:latest

      - name: Push Frontend Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/url-shortener-frontend:latest

      # Build Backend Docker Image
      - name: Build Backend Docker Image
        working-directory: ./Backend
        run: docker build -t url-shortener-backend .

      - name: Tag Backend Image
        run: |
          docker tag url-shortener-backend:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/url-shortener-backend:latest

      - name: Push Backend Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/url-shortener-backend:latest

      # Deploy Frontend
      - name: Deploy Frontend Service
        run: |
          aws ecs update-service \
            --cluster url-shortener-cluster \
            --service frontend-service \
            --force-new-deployment

      # Deploy Backend
      - name: Deploy Backend Service
        run: |
          aws ecs update-service \
            --cluster url-shortener-cluster \
            --service backend-service \
            --force-new-deployment